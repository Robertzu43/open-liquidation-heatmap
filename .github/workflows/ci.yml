name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q -ra
      - run: python scripts/check_install.py
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q -ra
      - run: python scripts/check_install.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: node --check web/app.js
      - name: Offline browser acceptance
        run: |
          python -m liqmap.server --port 8767 > /tmp/open-liq-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8767/healthz', timeout=1).close()
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit('server did not start')
          PY
          python tests/browser/smoke.py --url http://127.0.0.1:8767 --output browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: browser-artifacts
