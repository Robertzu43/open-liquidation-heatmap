# Ruff, mypy, and an offline pytest run on every push and pull request.
# Sockets are disabled for that run. A weekly job (and any manual run) hits
# live public Binance, Bybit, and OKX endpoints. GitHub-hosted runners are
# typically in the US, so an HTTP 451 or country block skips that exchange
# instead of failing the job. See docs/DEPLOY.md.

name: CI

on:
  push:
  pull_request:
  schedule:
    # Monday 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      # heatmap.py stays with the model rewrite. Expand this path when it lands.
      - name: Ruff
        run: ruff check tests --target-version py311

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Mypy
        run: >
          mypy tests/validation
          --python-version 3.11
          --ignore-missing-imports
          --disallow-untyped-defs
          --warn-unused-ignores
          --no-error-summary

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Offline pytest with coverage
        env:
          MPLBACKEND: Agg
        # -o addopts= clears pytest.ini so these flags are not applied twice.
        # Network stays blocked (--disable-socket). The coverage report is the
        # term-missing table plus coverage.xml.
        run: >
          pytest -q -ra
          -o addopts=
          --disable-socket
          --allow-unix-socket
          --cov=heatmap
          --cov=tests.validation.oracle
          --cov=tests.validation.adapter
          --cov-report=term-missing
          --cov-report=xml

  smoke:
    name: public endpoint smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Live public endpoints
        env:
          RUN_NETWORK: "1"
          MPLBACKEND: Agg
        # pytest.ini still disables sockets. Each smoke test carries
        # allow_hosts for the exchange allowlist, and skips on HTTP 451
        # (Binance from US runners) or a Bybit country block.
        run: >
          pytest -q -ra
          tests/validation/test_public_endpoints.py
          -m network
          -o addopts=
          --disable-socket
          --allow-unix-socket
