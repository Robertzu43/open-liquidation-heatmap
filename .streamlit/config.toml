# Shared by local `streamlit run`, Community Cloud, and the Docker image.
# The container entrypoint sets the port from $PORT (default 7860).

[browser]
gatherUsageStats = false

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 5

[theme]
base = "dark"
primaryColor = "#E85D04"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161A22"
textColor = "#F4F4F5"
font = "sans serif"

[client]
toolbarMode = "minimal"
