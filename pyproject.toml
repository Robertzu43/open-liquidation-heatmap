[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-liquidation-heatmap"
version = "0.2.0"
description = "Independent liquidation heatmap estimated from public perpetual-futures data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robert Z." }]
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "requests==2.32.3",
  "matplotlib==3.9.2",
  "plotly==5.24.1",
  "streamlit==1.39.0",
  "pyarrow==17.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
olh = "olh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
