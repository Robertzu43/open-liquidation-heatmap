[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-liquidation-heatmap"
version = "0.3.0"
description = "Inspectable public-data liquidation scenarios and reproducible research tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Open Liq contributors"}]
dependencies = ["requests==2.34.2", "numpy==2.4.6", "matplotlib==3.11.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.170.12"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
liqmap = "liqmap.server:main"
liqmap-research = "liqmap.research:main"

[project.urls]
Repository = "https://github.com/Robertzu43/open-liquidation-heatmap"
Issues = "https://github.com/Robertzu43/open-liquidation-heatmap/issues"

[tool.setuptools]
packages = ["liqmap", "liqmap_web"]
py-modules = ["heatmap"]
package-dir = {liqmap_web = "web"}

[tool.setuptools.package-data]
liqmap_web = ["*.html", "*.css", "*.js", "assets/*.png"]
