[pytest]
# Offline by default. Live smoke tests opt in with RUN_NETWORK=1 and
# @pytest.mark.allow_hosts restricted to the exchange allowlist.
addopts =
    --disable-socket
    --allow-unix-socket
    --cov=heatmap
    --cov=tests.validation.oracle
    --cov=tests.validation.adapter
    --cov-report=term-missing
    --cov-report=xml
markers =
    network: live public Binance, Bybit, or OKX calls; skipped unless RUN_NETWORK=1
testpaths = tests
